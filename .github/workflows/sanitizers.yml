name: Sanitizers

on:
  push:
    paths-ignore:
      - "docs/**"
      - "Doxyfile"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "SESSION.md"
      - "REVIEW.md"
      - "benchmark/**"
      - "imgs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Doxyfile"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "SESSION.md"
      - "REVIEW.md"
      - "benchmark/**"
      - "imgs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  asan-ubsan:
    name: ASan + UBSan (ubuntu-gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Boost Graph
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-graph-dev

      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build-san \
            -DNXPP_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: |
          cmake --build build-san

      - name: Run tests under sanitizers
        id: sanitizer_tests
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set +e
          ctest --test-dir build-san --output-on-failure | tee sanitizer-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish sanitizer summary
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.sanitizer_tests.outputs.exit_code }}
        run: |
          if [ "${TEST_EXIT_CODE:-1}" = "0" ]; then
            status_word="SUCCESS"
          else
            status_word="FAILURE"
          fi

          if [ -f sanitizer-output.txt ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' sanitizer-output.txt > sanitizer-output-clean.txt
          fi

          {
            echo "## Sanitizers"
            echo
            echo "- Runner: \`ubuntu-latest\`"
            echo "- Compiler: \`g++\`"
            echo "- Sanitizers: \`address,undefined\`"
            echo "- Status: ${status_word}"
            echo "- Command: \`ctest --test-dir build-san --output-on-failure\`"
            if [ -f sanitizer-output-clean.txt ]; then
              echo
              echo "### Output"
              echo
              echo '```text'
              cat sanitizer-output-clean.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
