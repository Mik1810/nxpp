name: WASM Release

on:
  push:
    tags:
      - "wasm-v*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  verify:
    name: verify wasm package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.9"
          actions-cache-folder: emsdk-cache

      - name: Install supported Boost headers
        run: |
          boost_version="1.86.0"
          boost_tag="${boost_version//./_}"
          boost_root="$RUNNER_TEMP/boost_${boost_tag}"
          curl -fsSL "https://archives.boost.io/release/${boost_version}/source/boost_${boost_tag}.tar.gz" -o "$RUNNER_TEMP/boost_${boost_tag}.tar.gz"
          tar -xzf "$RUNNER_TEMP/boost_${boost_tag}.tar.gz" -C "$RUNNER_TEMP"
          echo "BOOST_INCLUDE=$boost_root" >> "$GITHUB_ENV"

      - name: Install package dependencies
        working-directory: wasm
        run: npm ci

      - name: Validate release tag and package version
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./wasm/package.json').version")"
          expected_tag="wasm-v${package_version}"

          if [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}; expected ${expected_tag}." >&2
            exit 1
          fi

          if npm view "@mik1810/nxpp-wasm@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "@mik1810/nxpp-wasm@${package_version} already exists on npmjs." >&2
            exit 1
          fi

          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${expected_tag}" >> "$GITHUB_OUTPUT"

      - name: Build Node-compatible WASM module
        env:
          NXPP_WASM_EMIT_TSD: "1"
        run: bash wasm/scripts/build_wasm_node_module.sh

      - name: Verify reproducible packaged runtime artifacts
        run: bash wasm/scripts/verify_wasm_runtime_reproducibility.sh

      - name: Verify raw WASM contract
        run: |
          npm --prefix wasm run check:raw-contract
          git diff --exit-code -- wasm/generated

      - name: Verify TypeScript facade artifacts
        run: |
          npm --prefix wasm run build:types
          git diff --exit-code -- wasm/dist

      - name: Run Node API contract tests
        env:
          NXPP_WASM_NODE_CONTRACT_SKIP_BUILD: "1"
        run: bash wasm/scripts/run_wasm_node_contract_tests.sh

      - name: Run Emscripten formal suite
        env:
          NXPP_WASM_INCLUDE_LARGE: "1"
          NXPP_WASM_INCLUDE_NODE_CONTRACT: "0"
        run: bash wasm/scripts/run_wasm_tests.sh

      - name: Run npm package consumer test
        env:
          NXPP_WASM_NPM_PACK_SKIP_BUILD: "1"
        run: bash wasm/scripts/run_npm_pack_consumer_test.sh

      - name: Run package smoke example
        run: node wasm/nxpp_example.js

      - name: Pack verified Node package
        working-directory: wasm
        run: |
          mkdir -p "$RUNNER_TEMP/nxpp-wasm-package"
          tarball_name=$(npm pack --silent --pack-destination "$RUNNER_TEMP/nxpp-wasm-package")
          mv "$RUNNER_TEMP/nxpp-wasm-package/$tarball_name" "$RUNNER_TEMP/nxpp-wasm-package/nxpp-wasm-package.tgz"

      - name: Upload Node package for version checks
        uses: actions/upload-artifact@v7
        with:
          name: nxpp-wasm-package
          path: ${{ runner.temp }}/nxpp-wasm-package/nxpp-wasm-package.tgz
          if-no-files-found: error

  node-package-consumer:
    name: packed consumer (Node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install TypeScript for declaration check
        working-directory: wasm
        run: npm ci

      - name: Download verified Node package
        uses: actions/download-artifact@v8
        with:
          name: nxpp-wasm-package
          path: ${{ runner.temp }}/nxpp-wasm-package

      - name: Check installed package and public types
        env:
          NXPP_WASM_NPM_PACK_SKIP_BUILD: "1"
          NXPP_WASM_NPM_PACK_TARBALL: ${{ runner.temp }}/nxpp-wasm-package/nxpp-wasm-package.tgz
        run: bash wasm/scripts/run_npm_pack_consumer_test.sh

  publish:
    name: publish verified wasm package
    needs: [verify, node-package-consumer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download verified Node package
        uses: actions/download-artifact@v8
        with:
          name: nxpp-wasm-package
          path: ${{ runner.temp }}/nxpp-wasm-package

      - name: Validate npm staged publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          npm_major="${npm_version%%.*}"
          npm_minor="${npm_version#*.}"
          npm_minor="${npm_minor%%.*}"

          if [ "$npm_major" -lt 11 ] || { [ "$npm_major" -eq 11 ] && [ "$npm_minor" -lt 15 ]; }; then
            echo "npm 11.15.0 or newer is required for staged publishing; found ${npm_version}." >&2
            exit 1
          fi

      - name: Stage package on npmjs
        id: npm_stage
        run: npm stage publish "$RUNNER_TEMP/nxpp-wasm-package/nxpp-wasm-package.tgz" --access public --registry=https://registry.npmjs.org/

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mik1810"
          package-manager-cache: false

      - name: Publish package to GitHub Packages
        id: github_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP/nxpp-wasm-package/nxpp-wasm-package.tgz" --registry=https://npm.pkg.github.com/

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WASM Release"
            echo
            echo "- Version: \`${{ needs.verify.outputs.version }}\`"
            echo "- Tag: \`${{ needs.verify.outputs.tag }}\`"
            echo "- Emscripten: \`6.0.9\`"
            echo "- npmjs staging outcome: \`${{ steps.npm_stage.outcome }}\`"
            echo "- GitHub Packages outcome: \`${{ steps.github_publish.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
