name: External Consumers

on:
  push:
    paths-ignore:
      - "docs/**"
      - "Doxyfile"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "SESSION.md"
      - "REVIEW.md"
      - "benchmark/**"
      - "imgs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Doxyfile"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "SESSION.md"
      - "REVIEW.md"
      - "benchmark/**"
      - "imgs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  external-consumers:
    name: external-consumers (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Download Boost headers
        run: |
          set -euo pipefail
          boost_version="1.86.0"
          boost_tag="${boost_version//./_}"
          boost_archive="boost_${boost_tag}.tar.gz"
          boost_url="https://archives.boost.io/release/${boost_version}/source/${boost_archive}"
          boost_root="$RUNNER_TEMP/boost_${boost_tag}"

          if [ ! -d "$boost_root/boost" ]; then
            curl -fsSL "$boost_url" -o "$RUNNER_TEMP/$boost_archive"
            tar -xzf "$RUNNER_TEMP/$boost_archive" -C "$RUNNER_TEMP"
          fi

          echo "BOOST_ROOT=$boost_root" >> "$GITHUB_ENV"
          echo "Boost_ROOT=$boost_root" >> "$GITHUB_ENV"

      - name: Run external-consumer integration modes
        id: external
        shell: bash
        run: |
          set +e
          bash scripts/unix/run_external_consumer_tests.sh | tee external-consumers-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish external-consumer summary
        if: always()
        env:
          EXTERNAL_EXIT_CODE: ${{ steps.external.outputs.exit_code }}
        shell: bash
        run: |
          if [ "${EXTERNAL_EXIT_CODE:-1}" = "0" ]; then
            status_word="SUCCESS"
          else
            status_word="FAILURE"
          fi

          if [ -f external-consumers-output.txt ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' external-consumers-output.txt > external-consumers-output-clean.txt
          fi

          {
            echo "## External Consumer Integration Modes"
            echo
            echo "- Status: ${status_word}"
            echo "- Command: \`bash scripts/unix/run_external_consumer_tests.sh\`"
            echo "- Covered required modes:"
            echo "  - vendored CMake with add_subdirectory(nxpp)"
            echo "  - installed-package CMake with find_package(nxpp CONFIG REQUIRED)"
            echo "  - standalone single-header consumer"
            echo
            if [ -f external-consumers-output-clean.txt ]; then
              echo "### Output"
              echo
              echo '```text'
              cat external-consumers-output-clean.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
