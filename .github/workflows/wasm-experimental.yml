name: Wasm Experimental

on:
  push:
    paths:
      - "include/**"
      - "wasm/**"
      - ".github/workflows/wasm-experimental.yml"
  pull_request:
    paths:
      - "include/**"
      - "wasm/**"
      - ".github/workflows/wasm-experimental.yml"
  workflow_dispatch:

jobs:
  wasm-node:
    name: wasm-node (experimental)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install package dependencies
        working-directory: wasm
        run: npm ci

      - name: Verify TypeScript facade artifacts
        run: |
          npm --prefix wasm run build:types
          git diff --exit-code -- wasm/dist

      - name: Install supported Boost headers
        run: |
          boost_version="1.86.0"
          boost_tag="${boost_version//./_}"
          boost_root="$RUNNER_TEMP/boost_${boost_tag}"
          curl -fsSL "https://archives.boost.io/release/${boost_version}/source/boost_${boost_tag}.tar.gz" -o "$RUNNER_TEMP/boost_${boost_tag}.tar.gz"
          tar -xzf "$RUNNER_TEMP/boost_${boost_tag}.tar.gz" -C "$RUNNER_TEMP"
          echo "BOOST_INCLUDE=$boost_root" >> "$GITHUB_ENV"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.9"
          actions-cache-folder: emsdk-cache

      - name: Run wasm node build, contract tests, npm-pack consumer, and formal suite
        id: wasm
        shell: bash
        env:
          NXPP_WASM_INCLUDE_LARGE: "1"
          NXPP_WASM_EMIT_TSD: "1"
        run: |
          set +e
          bash wasm/scripts/build_wasm_node_module.sh | tee wasm-node-build-output.txt
          node_build_status=${PIPESTATUS[0]}

          NXPP_WASM_NODE_CONTRACT_SKIP_BUILD=1 bash wasm/scripts/run_wasm_node_contract_tests.sh | tee wasm-node-contract-output.txt
          node_contract_status=${PIPESTATUS[0]}

          NXPP_WASM_INCLUDE_NODE_CONTRACT=0 bash wasm/scripts/run_wasm_tests.sh | tee wasm-tests-output.txt
          tests_status=${PIPESTATUS[0]}

          NXPP_WASM_NPM_PACK_SKIP_BUILD=1 bash wasm/scripts/run_npm_pack_consumer_test.sh | tee wasm-npm-pack-consumer-output.txt
          npm_pack_consumer_status=${PIPESTATUS[0]}

          if [ "$node_build_status" -eq 0 ] && [ "$node_contract_status" -eq 0 ] && [ "$tests_status" -eq 0 ] && [ "$npm_pack_consumer_status" -eq 0 ]; then
            status=0
          else
            status=1
          fi

          echo "node_build_exit_code=$node_build_status" >> "$GITHUB_OUTPUT"
          echo "node_contract_exit_code=$node_contract_status" >> "$GITHUB_OUTPUT"
          echo "tests_exit_code=$tests_status" >> "$GITHUB_OUTPUT"
          echo "npm_pack_consumer_exit_code=$npm_pack_consumer_status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Verify raw WASM contract
        run: |
          npm --prefix wasm run check:raw-contract
          git diff --exit-code -- wasm/generated

      - name: Verify reproducible packaged runtime artifacts
        run: bash wasm/scripts/verify_wasm_runtime_reproducibility.sh

      - name: Run browser facade smoke test
        run: |
          bash wasm/scripts/build_wasm_browser_demo.sh
          bash wasm/scripts/run_wasm_browser_smoke_test.sh

      - name: Pack verified Node package
        working-directory: wasm
        run: |
          mkdir -p "$RUNNER_TEMP/nxpp-wasm-package"
          tarball_name=$(npm pack --silent --pack-destination "$RUNNER_TEMP/nxpp-wasm-package")
          mv "$RUNNER_TEMP/nxpp-wasm-package/$tarball_name" "$RUNNER_TEMP/nxpp-wasm-package/nxpp-wasm-package.tgz"

      - name: Upload Node package for version checks
        uses: actions/upload-artifact@v7
        with:
          name: nxpp-wasm-package
          path: ${{ runner.temp }}/nxpp-wasm-package/nxpp-wasm-package.tgz
          if-no-files-found: error

      - name: Publish wasm summary
        if: always()
        env:
          WASM_EXIT_CODE: ${{ steps.wasm.outputs.exit_code }}
          WASM_NODE_BUILD_EXIT_CODE: ${{ steps.wasm.outputs.node_build_exit_code }}
          WASM_NODE_CONTRACT_EXIT_CODE: ${{ steps.wasm.outputs.node_contract_exit_code }}
          WASM_TESTS_EXIT_CODE: ${{ steps.wasm.outputs.tests_exit_code }}
          WASM_NPM_PACK_CONSUMER_EXIT_CODE: ${{ steps.wasm.outputs.npm_pack_consumer_exit_code }}
        shell: bash
        run: |
          if [ "${WASM_EXIT_CODE:-1}" = "0" ]; then
            status_word="SUCCESS"
          else
            status_word="FAILURE"
          fi

          if [ -f wasm-node-build-output.txt ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' wasm-node-build-output.txt > wasm-node-build-output-clean.txt
          fi

          if [ -f wasm-tests-output.txt ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' wasm-tests-output.txt > wasm-tests-output-clean.txt
          fi

          if [ -f wasm-node-contract-output.txt ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' wasm-node-contract-output.txt > wasm-node-contract-output-clean.txt
          fi

          if [ -f wasm-npm-pack-consumer-output.txt ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' wasm-npm-pack-consumer-output.txt > wasm-npm-pack-consumer-output-clean.txt
          fi

          {
            echo "## Wasm Experimental"
            echo
            echo "- Status: ${status_word}"
            echo "- Node module build exit code: ${WASM_NODE_BUILD_EXIT_CODE:-unknown}"
            echo "- Node contract exit code: ${WASM_NODE_CONTRACT_EXIT_CODE:-unknown}"
            echo "- Suite exit code: ${WASM_TESTS_EXIT_CODE:-unknown}"
            echo "- npm pack consumer exit code: ${WASM_NPM_PACK_CONSUMER_EXIT_CODE:-unknown}"
            echo "- Commands:"
            echo "  - \`npm --prefix wasm run build:types\`"
            echo "  - \`git diff --exit-code -- wasm/dist\`"
            echo "  - \`bash wasm/scripts/build_wasm_node_module.sh\`"
            echo "  - \`NXPP_WASM_NODE_CONTRACT_SKIP_BUILD=1 bash wasm/scripts/run_wasm_node_contract_tests.sh\`"
            echo "  - \`NXPP_WASM_INCLUDE_NODE_CONTRACT=0 NXPP_WASM_INCLUDE_LARGE=1 bash wasm/scripts/run_wasm_tests.sh\`"
            echo "  - \`NXPP_WASM_NPM_PACK_SKIP_BUILD=1 bash wasm/scripts/run_npm_pack_consumer_test.sh\`"
            echo "- Scope: experimental wasm build/runtime verification via Emscripten + Node.js"
            echo
            if [ -f wasm-node-build-output-clean.txt ]; then
              echo "### Node module build output"
              echo
              echo '```text'
              cat wasm-node-build-output-clean.txt
              echo '```'
              echo
            fi
            if [ -f wasm-node-contract-output-clean.txt ]; then
              echo "### Node contract output"
              echo
              echo '```text'
              cat wasm-node-contract-output-clean.txt
              echo '```'
              echo
            fi
            if [ -f wasm-tests-output-clean.txt ]; then
              echo "### Suite output"
              echo
              echo '```text'
              cat wasm-tests-output-clean.txt
              echo '```'
              echo
            fi
            if [ -f wasm-npm-pack-consumer-output-clean.txt ]; then
              echo "### npm pack consumer output"
              echo
              echo '```text'
              cat wasm-npm-pack-consumer-output-clean.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  node-package-consumer:
    name: packed consumer (Node ${{ matrix.node }})
    needs: wasm-node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install TypeScript for declaration check
        working-directory: wasm
        run: npm ci

      - name: Download verified Node package
        uses: actions/download-artifact@v8
        with:
          name: nxpp-wasm-package
          path: ${{ runner.temp }}/nxpp-wasm-package

      - name: Check installed package and public types
        env:
          NXPP_WASM_NPM_PACK_SKIP_BUILD: "1"
          NXPP_WASM_NPM_PACK_TARBALL: ${{ runner.temp }}/nxpp-wasm-package/nxpp-wasm-package.tgz
        run: bash wasm/scripts/run_npm_pack_consumer_test.sh
